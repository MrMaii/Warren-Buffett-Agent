<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Standalone when you need one mind. Composable when the work needs a team.</title>
  <desc id="desc">需要一个判断时单独工作，需要协作时进入受治理的圆桌</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171411"/>
      <stop offset=".52" stop-color="#302a22"/>
      <stop offset="1" stop-color="#1f1b17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#625747" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#332c24" stop-opacity=".78"/>
      <stop offset="1" stop-color="#191612" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="glass-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eadcc2" stop-opacity=".92"/>
      <stop offset="1" stop-color="#bfa77b" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e6cf"/>
      <stop offset=".5" stop-color="#c5a875"/>
      <stop offset="1" stop-color="#6e5a41"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain">
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c5a875"/>
    </marker>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="772" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.8" stroke-opacity=".72"/>
  <path d="M48 86V48H86M1314 48H1352V86M48 734V772H86M1314 772H1352V734" fill="none" stroke="#eadcc2" stroke-opacity=".52" stroke-width="1.4"/>
  <rect width="1400" height="820" rx="26" fill="#eadcc2" opacity=".12" filter="url(#grain)"/>
  <text x="70" y="52" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="500" letter-spacing="2.4">HALL OF FAME STUDIO  /  AGENT 002  /  WARREN BUFFETT</text><text x="70" y="94" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="31" font-weight="700">Standalone when you need one mind. Composable when the work needs a team.</text><text x="70" y="127" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="400">需要一个判断时单独工作，需要协作时进入受治理的圆桌</text>
  <rect x="70" y="190" width="320" height="390" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="79" y="199" width="302" height="372" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><rect x="515" y="175" width="370" height="420" rx="22" fill="url(#glass-light)" stroke="url(#edge)" stroke-width="1.6" stroke-opacity=".78"/><rect x="524" y="184" width="352" height="402" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><rect x="1010" y="175" width="320" height="420" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="1019" y="184" width="302" height="402" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><rect x="300" y="650" width="800" height="78" rx="22" fill="url(#glass-light)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="309" y="659" width="782" height="60" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><path d="M400 385 L495 385" fill="none" stroke="#c5a875" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M905 385 L990 385" fill="none" stroke="#c5a875" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="105" y="235" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.45">DIRECT USE / 单独使用</text><text x="105" y="305" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="25" font-weight="700">Warren Buffett</text><text x="105" y="370" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="400">—  one Agent</text><text x="105" y="412" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="400">—  long-term owner lens</text><text x="105" y="454" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="400">—  open-source package</text><text x="700" y="235" fill="#874139" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.6">AGENT 002</text><text x="700" y="315" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="29" font-weight="700" text-anchor="middle">DEEP AGENT</text><text x="700" y="355" fill="#675440" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="middle">长期所有者与资本配置伙伴</text><line x1="595" y1="392" x2="805" y2="392" stroke="#874139" stroke-width="1.8" opacity=".78"/><text x="700" y="440" fill="#675440" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.2">ONE DISTINCT POINT OF VIEW</text><text x="700" y="480" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="14" font-weight="600" text-anchor="middle">A distinct judgment system, not a quote machine.</text><text x="1045" y="220" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.45">STUDIO NETWORK / 网络</text><rect x="1045" y="290" width="250" height="42" rx="12" fill="#211c17" fill-opacity=".74" stroke="#c5a875" stroke-opacity=".5"/><text x="1065" y="317" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">Talent Market</text><text x="1280" y="317" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="400" text-anchor="end">dossier</text><rect x="1045" y="352" width="250" height="42" rx="12" fill="#211c17" fill-opacity=".74" stroke="#c5a875" stroke-opacity=".5"/><text x="1065" y="379" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">Persona Chat</text><text x="1280" y="379" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="400" text-anchor="end">fingerprint</text><rect x="1045" y="414" width="250" height="42" rx="12" fill="#211c17" fill-opacity=".74" stroke="#c5a875" stroke-opacity=".5"/><text x="1065" y="441" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">Project Team</text><text x="1280" y="441" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="400" text-anchor="end">review</text><rect x="1045" y="476" width="250" height="42" rx="12" fill="#211c17" fill-opacity=".74" stroke="#c5a875" stroke-opacity=".5"/><text x="1065" y="503" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">Proof System</text><text x="1280" y="503" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="400" text-anchor="end">revision</text><text x="700" y="682" fill="#874139" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">ROUND TABLE / 共同项目目标</text><text x="700" y="713" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="700" text-anchor="middle">contribute → disagree → review → reintegrate</text>
  <text x="70" y="787" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="400" letter-spacing="1.1">ONE AGENT ENTERS THE STUDIO WITHOUT LOSING ITS EVIDENCE, METHOD, OR BOUNDARIES</text>
</svg>
