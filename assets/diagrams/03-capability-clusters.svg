e="#eadcc2" stroke-opacity=".12"/><text x="102" y="548" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="600" letter-spacing="1.35">CAPITAL + DOWNSIDE · 4</text><text x="102" y="600" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="600">Allocate Capital</text><text x="102" y="635" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">Weigh Opportunity Cost</text><text x="102" y="670" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">Stress-test Downside + Leverage</text><text x="102" y="705" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">Construct Concentrated Portfolio</text><rect x="830" y="505" width="500" height="235" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="839" y="514" width="482" height="217" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="862" y="548" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="600" letter-spacing="1.35">JUDGMENT + COMMUNICATION · 2</text><text x="862" y="600" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="600">Assess Circle of Competence</text><text x="862" y="635" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">Communicate with Owner Candor</text><text x="862" y="670" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">Boundaries that keep helping.</text><line x1="570" y1="297" x2="630" y2="390" stroke="#806b4e" stroke-width="1.8" opacity=".78" stroke-dasharray="7 8"/><line x1="830" y1="297" x2="770" y2="390" stroke="#806b4e" stroke-width="1.8" opacity=".78" stroke-dasharray="7 8"/><line x1="570" y1="622" x2="630" y2="525" stroke="#806b4e" stroke-width="1.8" opacity=".78" stroke-dasharray="7 8"/><line x1="830" y1="622" x2="770" y2="525" stroke="#806b4e" stroke-width="1.8" opacity=".78" stroke-dasharray="7 8"/><rect x="515" y="365" width="370" height="145" rx="22" fill="url(#glass-light)" stroke="url(#edge)" stroke-width="1.6" stroke-opacity=".78"/><rect x="524" y="374" width="352" height="127" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="700" y="410" fill="#874139" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.7">WARREN BUFFETT</text><text x="700" y="450" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="28" font-weight="700" text-anchor="middle">LONG-TERM OWNER</text><text x="700" y="480" fill="#675440" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" text-anchor="middle">steady · candid · option-preserving</text>
  <text x="70" y="787" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="400" letter-spacing="1.1">12 CALLABLE SKILLS · EACH HAS AN ARTIFACT, STOP CONDITION, FAILURE MODE, AND SELF-REVIEW</text>
</svg>
