<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Calm is not passivity. It is a better order of operations.</title>
  <desc id="desc">平静不是被动，而是把判断重新排成更好的顺序</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171411"/>
      <stop offset=".52" stop-color="#302a22"/>
      <stop offset="1" stop-color="#1f1b17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#625747" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#332c24" stop-opacity=".78"/>
      <stop offset="1" stop-color="#191612" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="glass-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eadcc2" stop-opacity=".92"/>
      <stop offset="1" stop-color="#bfa77b" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e6cf"/>
      <stop offset=".5" stop-color="#c5a875"/>
      <stop offset="1" stop-color="#6e5a41"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain">
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c5a875"/>
    </marker>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="772" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.8" stroke-opacity=".72"/>
  <path d="M48 86V48H86M1314 48H1352V86M48 734V772H86M1314 772H1352V734" fill="none" stroke="#eadcc2" stroke-opacity=".52" stroke-width="1.4"/>
  <rect width="1400" height="820" rx="26" fill="#eadcc2" opacity=".12" filter="url(#grain)"/>
  <text x="70" y="52" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="500" letter-spacing="2.4">HALL OF FAME STUDIO  /  AGENT 002  /  WARREN BUFFETT</text><text x="70" y="94" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="31" font-weight="700">Calm is not passivity. It is a better order of operations.</text><text x="70" y="127" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="400">平静不是被动，而是把判断重新排成更好的顺序</text>
  <rect x="70" y="180" width="270" height="500" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="79" y="189" width="252" height="482" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><rect x="390" y="180" width="520" height="500" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="399" y="189" width="502" height="482" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><rect x="970" y="180" width="360" height="500" rx="22" fill="url(#glass-light)" stroke="url(#edge)" stroke-width="1.6" stroke-opacity=".78"/><rect x="979" y="189" width="342" height="482" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="105" y="225" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="600" letter-spacing="1.8">INPUT / 热点输入</text><text x="105" y="278" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Urgency</text><text x="105" y="326" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Social proof</text><text x="105" y="374" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Headline noise</text><text x="105" y="422" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Sunk cost</text><text x="105" y="470" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Leverage</text><text x="105" y="518" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="21" font-weight="600">Permanent loss</text><text x="105" y="580" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">A decision arrives hot.</text><text x="105" y="606" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">The bar stays high.</text><path d="M350 430 L380 430" fill="none" stroke="#c5a875" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="425" y="225" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="600" letter-spacing="1.6">ORDER OF OPERATIONS / 顺序</text><rect x="420" y="260" width="460" height="72" rx="16" fill="#211c17" fill-opacity=".78" stroke="#c5a875" stroke-opacity=".52"/><circle cx="457" cy="296" r="18" fill="#874139" opacity=".92"/><text x="457" y="302" fill="#f0e5cf" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="495" y="291" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="19" font-weight="700">What is known?</text><text x="495" y="315" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Facts · estimates · inferences · unknowns</text><rect x="420" y="352" width="460" height="72" rx="16" fill="#211c17" fill-opacity=".78" stroke="#c5a875" stroke-opacity=".52"/><circle cx="457" cy="388" r="18" fill="#874139" opacity=".92"/><text x="457" y="394" fill="#f0e5cf" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="495" y="383" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="19" font-weight="700">What can cause permanent loss?</text><text x="495" y="407" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Impairment · leverage · forced sale · trust</text><rect x="420" y="444" width="460" height="72" rx="16" fill="#211c17" fill-opacity=".78" stroke="#c5a875" stroke-opacity=".52"/><circle cx="457" cy="480" r="18" fill="#874139" opacity=".92"/><text x="457" y="486" fill="#f0e5cf" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="495" y="475" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="19" font-weight="700">What can be made reversible?</text><text x="495" y="499" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Stage · cap · test · preserve liquidity</text><rect x="420" y="536" width="460" height="72" rx="16" fill="#211c17" fill-opacity=".78" stroke="#c5a875" stroke-opacity=".52"/><circle cx="457" cy="572" r="18" fill="#874139" opacity=".92"/><text x="457" y="578" fill="#f0e5cf" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="495" y="567" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="19" font-weight="700">What is the next-best use?</text><text x="495" y="591" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Capital · time · attention · reputation</text><path d="M920 430 L960 430" fill="none" stroke="#c5a875" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1005" y="225" fill="#874139" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700" letter-spacing="1.8">OUTPUT / 可检验决策</text><text x="1005" y="300" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="24" font-weight="700">Durable decision</text><text x="1005" y="338" fill="#675440" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" font-weight="400">经得起复核的决定</text><text x="1005" y="408" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">—  explicit downside</text><text x="1005" y="450" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">—  preserved options</text><text x="1005" y="492" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">—  named alternative</text><text x="1005" y="534" fill="#31271e" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="18" font-weight="400">—  falsifier + review</text><line x1="1005" y1="578" x2="1287" y2="578" stroke="#874139" stroke-width="1.8" opacity=".78"/><text x="1005" y="616" fill="#675440" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">owner · patience · margin of safety</text>
  <text x="70" y="787" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="400" letter-spacing="1.1">VOLATILITY IS NOT THE SAME AS PERMANENT LOSS · PATIENCE STILL REQUIRES A REVIEW DATE</text>
</svg>
