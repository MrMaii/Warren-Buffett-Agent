<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">One person. Four different kinds of help.</title>
  <desc id="desc">人格核心始终在线，变化的是工作方法与 Skill 边界</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171411"/>
      <stop offset=".52" stop-color="#302a22"/>
      <stop offset="1" stop-color="#1f1b17"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#625747" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#332c24" stop-opacity=".78"/>
      <stop offset="1" stop-color="#191612" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="glass-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eadcc2" stop-opacity=".92"/>
      <stop offset="1" stop-color="#bfa77b" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e6cf"/>
      <stop offset=".5" stop-color="#c5a875"/>
      <stop offset="1" stop-color="#6e5a41"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain">
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c5a875"/>
    </marker>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1352" height="772" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.8" stroke-opacity=".72"/>
  <path d="M48 86V48H86M1314 48H1352V86M48 734V772H86M1314 772H1352V734" fill="none" stroke="#eadcc2" stroke-opacity=".52" stroke-width="1.4"/>
  <rect width="1400" height="820" rx="26" fill="#eadcc2" opacity=".12" filter="url(#grain)"/>
  <text x="70" y="52" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="500" letter-spacing="2.4">HALL OF FAME STUDIO  /  AGENT 002  /  WARREN BUFFETT</text><text x="70" y="94" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="31" font-weight="700">One person. Four different kinds of help.</text><text x="70" y="127" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="400">人格核心始终在线，变化的是工作方法与 Skill 边界</text>
  <rect x="70" y="185" width="285" height="455" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="79" y="194" width="267" height="437" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="98" y="230" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.5">RELATIONAL / 关系</text><text x="98" y="294" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="25" font-weight="700">See the person.</text><text x="98" y="352" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">Ordinary conversation</text><text x="98" y="384" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">vulnerability · uncertainty</text><line x1="98" y1="470" x2="327" y2="470" stroke="#806b4e" stroke-width="1.8" opacity=".78"/><text x="98" y="520" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">0 hard Skills</text><text x="98" y="566" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">No memo.</text><text x="98" y="595" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Stay at the table.</text><rect x="395" y="185" width="285" height="455" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="404" y="194" width="267" height="437" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="423" y="230" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.5">EXPLORATORY / 探索</text><text x="423" y="294" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="25" font-weight="700">Contribute first.</text><text x="423" y="352" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">Ideas · unfamiliar fields</text><text x="423" y="384" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">learning · vague plans</text><line x1="423" y1="470" x2="652" y2="470" stroke="#806b4e" stroke-width="1.8" opacity=".78"/><text x="423" y="520" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">0 by default</text><text x="423" y="566" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Give 2–3 concrete starts.</text><text x="423" y="595" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Ask one real question.</text><rect x="720" y="185" width="285" height="455" rx="22" fill="url(#glass)" stroke="#c5a875" stroke-width="1.6" stroke-opacity=".78"/><rect x="729" y="194" width="267" height="437" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="748" y="230" fill="#c5a875" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.5">TASK / 任务</text><text x="748" y="294" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="25" font-weight="700">Make the artifact.</text><text x="748" y="352" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">Analysis · comparison</text><text x="748" y="384" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">decision · owner memo</text><line x1="748" y1="470" x2="977" y2="470" stroke="#806b4e" stroke-width="1.8" opacity=".78"/><text x="748" y="520" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">1–3 routed Skills</text><text x="748" y="566" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Named output.</text><text x="748" y="595" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">STOP + self-review.</text><rect x="1045" y="185" width="285" height="455" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.6" stroke-opacity=".78"/><rect x="1054" y="194" width="267" height="437" rx="16" fill="none" stroke="#eadcc2" stroke-opacity=".12"/><text x="1073" y="230" fill="#874139" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.5">HIGH-STAKES / 高风险</text><text x="1073" y="294" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="25" font-weight="700">Protect survival.</text><text x="1073" y="352" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">Specific securities</text><text x="1073" y="384" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400">major capital · irreversible acts</text><line x1="1073" y1="470" x2="1302" y2="470" stroke="#874139" stroke-width="1.8" opacity=".78"/><text x="1073" y="520" fill="#f0e5cf" font-family="Georgia,'Times New Roman','Microsoft YaHei',serif" font-size="16" font-weight="600">VERIFY FIRST</text><text x="1073" y="566" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">Current evidence + review.</text><text x="1073" y="595" fill="#b9aa8f" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="400">No promise. No transaction.</text>
  <text x="70" y="787" fill="#b9aa8f" font-family="Consolas,'Courier New',monospace" font-size="14" font-weight="400" letter-spacing="1.1">SKILL ACTIVATION CHANGES THE METHOD, NEVER THE HUMAN RELATIONSHIP</text>
</svg>
