<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Warren Buffett Agent inside HoloFame Studio</title><desc id="desc">The standalone Agent connects to the Talent Market, Persona Chat, governed project teams, and a larger roster inside Hall of Fame Studio.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080705"/><stop offset="1" stop-color="#24150f"/></linearGradient><radialGradient id="core"><stop stop-color="#f2e9d4"/><stop offset="1" stop-color="#b99352"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="22"/></filter></defs>
  <rect width="1400" height="700" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1348" height="648" rx="22" fill="none" stroke="#b99352" stroke-opacity=".65"/>
  <text x="70" y="82" fill="#b99352" font-family="Consolas,monospace" font-size="17" letter-spacing="3">FROM ONE AGENT TO A GOVERNED ROUND TABLE</text>
  <text x="70" y="128" fill="#f2e9d4" font-family="Georgia,serif" font-size="31" font-weight="700">Standalone when you need one mind.</text>
  <text x="70" y="168" fill="#f2e9d4" font-family="Georgia,serif" font-size="31" font-weight="700">Composable when the work needs a team.</text>
  <g stroke="#8e7348" stroke-width="2" opacity=".75"><path d="M700 365L330 260M700 365L330 505M700 365L1070 260M700 365L1070 505"/><path d="M330 260L190 382M330 505L190 382M1070 260L1210 382M1070 505L1210 382"/></g>
  <circle cx="700" cy="365" r="132" fill="#b99352" fill-opacity=".18" filter="url(#glow)"/><circle cx="700" cy="365" r="98" fill="url(#core)"/>
  <text x="700" y="337" text-anchor="middle" fill="#17130f" font-family="Georgia,serif" font-size="22" font-weight="700">WARREN</text><text x="700" y="368" text-anchor="middle" fill="#17130f" font-family="Georgia,serif" font-size="22" font-weight="700">BUFFETT</text><text x="700" y="401" text-anchor="middle" fill="#3e3022" font-family="Consolas,monospace" font-size="15">AGENT 002</text><text x="700" y="430" text-anchor="middle" fill="#5d4630" font-family="Segoe UI,Arial" font-size="15">long-term owner</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="330" cy="260" r="78" fill="#211812" stroke="#b99352"/><text x="330" y="252" text-anchor="middle" fill="#f2e9d4" font-size="20" font-weight="700">Talent Market</text><text x="330" y="283" text-anchor="middle" fill="#b9aa8c" font-size="15">dossier + routing</text>
    <circle cx="330" cy="505" r="78" fill="#211812" stroke="#b99352"/><text x="330" y="497" text-anchor="middle" fill="#f2e9d4" font-size="20" font-weight="700">Persona Chat</text><text x="330" y="528" text-anchor="middle" fill="#b9aa8c" font-size="15">same fingerprint</text>
    <circle cx="1070" cy="260" r="78" fill="#211812" stroke="#b99352"/><text x="1070" y="252" text-anchor="middle" fill="#f2e9d4" font-size="20" font-weight="700">Project Team</text><text x="1070" y="283" text-anchor="middle" fill="#b9aa8c" font-size="15">Leader + Reviewer</text>
    <circle cx="1070" cy="505" r="78" fill="#211812" stroke="#b99352"/><text x="1070" y="497" text-anchor="middle" fill="#f2e9d4" font-size="20" font-weight="700">Proof System</text><text x="1070" y="528" text-anchor="middle" fill="#b9aa8c" font-size="15">evidence + revision</text>
    <circle cx="190" cy="382" r="58" fill="#1a1210" stroke="#7e1f2b"/><text x="190" y="377" text-anchor="middle" fill="#f2e9d4" font-size="17" font-weight="700">Direct use</text><text x="190" y="402" text-anchor="middle" fill="#b9aa8c" font-size="13">one Agent</text>
    <circle cx="1210" cy="382" r="58" fill="#1a1210" stroke="#7e1f2b"/><text x="1210" y="377" text-anchor="middle" fill="#f2e9d4" font-size="17" font-weight="700">Roundtable</text><text x="1210" y="402" text-anchor="middle" fill="#b9aa8c" font-size="13">many Agents</text>
  </g>
  <rect x="460" y="584" width="480" height="58" rx="29" fill="#f2e9d4"/><text x="700" y="621" text-anchor="middle" fill="#17130f" font-family="Consolas,monospace" font-size="17" font-weight="700">EXPLORE HOLOFAME STUDIO →</text>
