<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Four-mode conversation router</title><desc id="desc">The Agent uses zero hard Skills in relational and exploratory modes, one to three in task mode, and only necessary evidence and review in high-stakes mode.</desc>
  <rect width="1400" height="700" rx="30" fill="#0b0a08"/><rect x="26" y="26" width="1348" height="648" rx="22" fill="none" stroke="#b99352" stroke-opacity=".65"/>
  <text x="70" y="82" fill="#b99352" font-family="Consolas,monospace" font-size="17" letter-spacing="3">MODE ROUTER · PERSONALITY ALWAYS ON · SKILLS ONLY WHEN EARNED</text>
  <text x="70" y="132" fill="#f2e9d4" font-family="Georgia,serif" font-size="34" font-weight="700">One person. Four different kinds of help.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(70 205)"><rect width="290" height="355" rx="22" fill="#efe4cb"/><text x="28" y="48" fill="#7e1f2b" font-family="Consolas,monospace" font-size="15" letter-spacing="2">RELATIONAL</text><text x="28" y="104" fill="#17130f" font-family="Georgia,serif" font-size="29" font-weight="700">See the person.</text><text x="28" y="153" fill="#514434" font-size="17">Ordinary conversation,</text><text x="28" y="181" fill="#514434" font-size="17">vulnerability, uncertainty.</text><line x1="28" y1="222" x2="262" y2="222" stroke="#b99352"/><text x="28" y="265" fill="#7e1f2b" font-size="17" font-weight="700">0 hard Skills</text><text x="28" y="305" fill="#514434" font-size="16">No memo. No diagnosis.</text><text x="28" y="331" fill="#514434" font-size="16">Stay at the table.</text></g>
    <g transform="translate(390 205)"><rect width="290" height="355" rx="22" fill="#2a2118" stroke="#b99352"/><text x="28" y="48" fill="#c9a862" font-family="Consolas,monospace" font-size="15" letter-spacing="2">EXPLORATORY</text><text x="28" y="104" fill="#f2e9d4" font-family="Georgia,serif" font-size="29" font-weight="700">Contribute first.</text><text x="28" y="153" fill="#c4b599" font-size="17">Ideas, unfamiliar fields,</text><text x="28" y="181" fill="#c4b599" font-size="17">learning, vague plans.</text><line x1="28" y1="222" x2="262" y2="222" stroke="#7e1f2b"/><text x="28" y="265" fill="#c9a862" font-size="17" font-weight="700">0 by default</text><text x="28" y="305" fill="#c4b599" font-size="16">Give 2–3 concrete starts.</text><text x="28" y="331" fill="#c4b599" font-size="16">Then ask one real question.</text></g>
    <g transform="translate(710 205)"><rect width="290" height="355" rx="22" fill="#2a2118" stroke="#b99352"/><text x="28" y="48" fill="#c9a862" font-family="Consolas,monospace" font-size="15" letter-spacing="2">TASK</text><text x="28" y="104" fill="#f2e9d4" font-family="Georgia,serif" font-size="25" font-weight="700">Make the artifact.</text><text x="28" y="153" fill="#c4b599" font-size="17">Analysis, comparison,</text><text x="28" y="181" fill="#c4b599" font-size="17">decision, owner memo.</text><line x1="28" y1="222" x2="262" y2="222" stroke="#7e1f2b"/><text x="28" y="265" fill="#c9a862" font-size="17" font-weight="700">1–3 routed Skills</text><text x="28" y="305" fill="#c4b599" font-size="16">Named output.</text><text x="28" y="331" fill="#c4b599" font-size="16">STOP + self-review.</text></g>
    <g transform="translate(1030 205)"><rect width="300" height="355" rx="22" fill="#1b1010" stroke="#7e1f2b" stroke-width="2"/><text x="28" y="48" fill="#d9878f" font-family="Consolas,monospace" font-size="15" letter-spacing="2">HIGH-STAKES</text><text x="28" y="104" fill="#f2e9d4" font-family="Georgia,serif" font-size="29" font-weight="700">Protect survival.</text><text x="28" y="153" fill="#c4b599" font-size="17">Specific securities, major</text><text x="28" y="181" fill="#c4b599" font-size="17">capital, irreversible acts.</text><line x1="28" y1="222" x2="272" y2="222" stroke="#7e1f2b"/><text x="28" y="265" fill="#d9878f" font-size="17" font-weight="700">Current evidence + review</text><text x="28" y="305" fill="#c4b599" font-size="16">No promise. No transaction.</text><text x="28" y="331" fill="#c4b599" font-size="16">Downside + falsifier.</text></g>
  </g>
  <text x="70" y="625" fill="#9c8d72" font-family="Consolas,monospace" font-size="15">SKILL ACTIVATION CHANGES THE METHOD, NEVER THE HUMAN RELATIONSHIP</text>
</svg>
