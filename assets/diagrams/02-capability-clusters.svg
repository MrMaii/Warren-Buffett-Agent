<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Warren Buffett Agent capability clusters</title>
  <desc id="desc">Twelve callable Skills are organized into business quality, economics and value, capital and downside, and judgment and communication.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0907"/><stop offset="1" stop-color="#25160f"/></linearGradient><radialGradient id="core"><stop stop-color="#f2e9d4"/><stop offset="1" stop-color="#c9ab72"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1400" height="820" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1348" height="768" rx="22" fill="none" stroke="#b99352" stroke-opacity=".65"/>
  <text x="70" y="82" fill="#b99352" font-family="Consolas,monospace" font-size="17" letter-spacing="3">CALLABLE CAPABILITY · 12 SKILLS · 4 CLUSTERS</text>
  <text x="70" y="130" fill="#f2e9d4" font-family="Georgia,serif" font-size="34" font-weight="700">The person chooses the tools. The tools do not replace the person.</text>
  <g stroke="#735d3a" stroke-width="2" opacity=".7"><path d="M700 454L450 300M700 454L950 300M700 454L450 620M700 454L950 620"/></g>
  <circle cx="700" cy="454" r="120" fill="#b99352" fill-opacity=".22" filter="url(#glow)"/><circle cx="700" cy="454" r="92" fill="url(#core)"/>
  <text x="700" y="420" fill="#17130f" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">LONG-TERM</text>
  <text x="700" y="450" fill="#17130f" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">OWNER</text>
  <text x="700" y="482" fill="#3e3022" font-family="Consolas,monospace" font-size="15" text-anchor="middle">HUMAN CORE</text>
  <text x="700" y="512" fill="#5f4931" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">steady · candid · option-preserving</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="70" y="190" width="500" height="230" rx="22" fill="#1b1510" stroke="#b99352" stroke-opacity=".8"/>
    <text x="105" y="232" fill="#b99352" font-family="Consolas,monospace" font-size="16" letter-spacing="2">BUSINESS QUALITY · 3</text>
    <text x="105" y="280" fill="#f2e9d4" font-size="20" font-weight="700">Analyze Business Quality</text>
    <text x="105" y="321" fill="#e3d5b8" font-size="20">Map Economic Moat</text>
    <text x="105" y="362" fill="#e3d5b8" font-size="20">Evaluate Management Stewardship</text>
    <circle cx="530" cy="228" r="7" fill="#7e1f2b"/>
    <rect x="830" y="190" width="500" height="230" rx="22" fill="#1b1510" stroke="#b99352" stroke-opacity=".8"/>
    <text x="865" y="232" fill="#b99352" font-family="Consolas,monospace" font-size="16" letter-spacing="2">ECONOMICS + VALUE · 3</text>
    <text x="865" y="280" fill="#f2e9d4" font-size="20" font-weight="700">Normalize Owner Earnings</text>
    <text x="865" y="321" fill="#e3d5b8" font-size="20">Estimate Intrinsic Value</text>
    <text x="865" y="362" fill="#e3d5b8" font-size="20">Demand Margin of Safety</text>
    <circle cx="1290" cy="228" r="7" fill="#7e1f2b"/>
    <rect x="70" y="500" width="500" height="240" rx="22" fill="#1b1510" stroke="#b99352" stroke-opacity=".8"/>
    <text x="105" y="542" fill="#b99352" font-family="Consolas,monospace" font-size="16" letter-spacing="2">CAPITAL + DOWNSIDE · 4</text>
    <text x="105" y="590" fill="#f2e9d4" font-size="20" font-weight="700">Allocate Capital</text>
    <text x="105" y="629" fill="#e3d5b8" font-size="20">Weigh Opportunity Cost</text>
    <text x="105" y="668" fill="#e3d5b8" font-size="20">Stress-test Downside + Leverage</text>
    <text x="105" y="707" fill="#e3d5b8" font-size="20">Construct Concentrated Portfolio</text>
    <circle cx="530" cy="538" r="7" fill="#7e1f2b"/>
    <rect x="830" y="500" width="500" height="240" rx="22" fill="#1b1510" stroke="#b99352" stroke-opacity=".8"/>
    <text x="865" y="542" fill="#b99352" font-family="Consolas,monospace" font-size="16" letter-spacing="2">JUDGMENT + COMMUNICATION · 2</text>
    <text x="865" y="600" fill="#f2e9d4" font-size="20" font-weight="700">Assess Circle of Competence</text>
    <text x="865" y="645" fill="#e3d5b8" font-size="20">Communicate with Owner Candor</text>
    <text x="865" y="702" fill="#9f9075" font-size="17">Boundaries that keep helping.</text>
    <circle cx="1290" cy="538" r="7" fill="#7e1f2b"/>
  </g>
</svg>
