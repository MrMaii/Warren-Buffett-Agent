<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Persona-owned quality loop</title><desc id="desc">A draft passes through Buffett-specific checks for evidence, fabricated memory, competence exits, cheap reassurance, financial certainty, and complete artifacts before release.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#0b0a08"/><stop offset="1" stop-color="#21150f"/></linearGradient></defs>
  <rect width="1400" height="650" rx="30" fill="url(#bg)"/><rect x="26" y="26" width="1348" height="598" rx="22" fill="none" stroke="#b99352" stroke-opacity=".65"/>
  <text x="70" y="82" fill="#b99352" font-family="Consolas,monospace" font-size="17" letter-spacing="3">PERSONA-OWNED QUALITY GATE · ONE REVISION · BOUNDED FALLBACK</text>
  <text x="70" y="130" fill="#f2e9d4" font-family="Georgia,serif" font-size="34" font-weight="700">A good voice is not enough. The decision must survive inspection.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="70" y="240" width="240" height="190" rx="22" fill="#efe4cb"/><text x="190" y="292" text-anchor="middle" fill="#7e1f2b" font-family="Consolas,monospace" font-size="16">DRAFT</text><text x="190" y="346" text-anchor="middle" fill="#17130f" font-family="Georgia,serif" font-size="29" font-weight="700">Answer</text><text x="190" y="389" text-anchor="middle" fill="#514434" font-size="16">method + relationship</text>
    <path d="M330 335H395" stroke="#b99352" stroke-width="2"/><path d="M384 325l13 10-13 10" fill="none" stroke="#b99352" stroke-width="2"/>
    <rect x="405" y="190" width="510" height="290" rx="24" fill="#201812" stroke="#b99352" stroke-width="2"/><text x="445" y="235" fill="#b99352" font-family="Consolas,monospace" font-size="16" letter-spacing="2">BUFFETT QUALITY GATE</text>
    <text x="445" y="282" fill="#f2e9d4" font-size="18">✓ facts, estimates, unknowns separated</text><text x="445" y="320" fill="#f2e9d4" font-size="18">✓ no fabricated memory or current holdings</text><text x="445" y="358" fill="#f2e9d4" font-size="18">✓ no competence-based social exit</text><text x="445" y="396" fill="#f2e9d4" font-size="18">✓ no cheap reassurance or guaranteed return</text><text x="445" y="434" fill="#f2e9d4" font-size="18">✓ required artifact, downside, review, STOP</text>
    <path d="M935 278H1000" stroke="#b99352" stroke-width="2"/><path d="M989 268l13 10-13 10" fill="none" stroke="#b99352" stroke-width="2"/>
    <rect x="1010" y="200" width="320" height="120" rx="20" fill="#efe4cb"/><text x="1170" y="248" text-anchor="middle" fill="#7e1f2b" font-family="Consolas,monospace" font-size="15">CLEAR</text><text x="1170" y="289" text-anchor="middle" fill="#17130f" font-family="Georgia,serif" font-size="27" font-weight="700">Release</text>
    <path d="M935 395H1000" stroke="#7e1f2b" stroke-width="2"/><path d="M989 385l13 10-13 10" fill="none" stroke="#7e1f2b" stroke-width="2"/>
    <rect x="1010" y="350" width="320" height="120" rx="20" fill="#1c1010" stroke="#7e1f2b"/><text x="1170" y="398" text-anchor="middle" fill="#d9878f" font-family="Consolas,monospace" font-size="15">VIOLATION</text><text x="1170" y="439" text-anchor="middle" fill="#f2e9d4" font-family="Georgia,serif" font-size="27" font-weight="700">Revise or fallback</text>
    <path d="M1170 490C1170 565 650 570 650 500" fill="none" stroke="#7e1f2b" stroke-width="2" stroke-dasharray="8 7"/><path d="M640 514l10-14 10 14" fill="none" stroke="#7e1f2b" stroke-width="2"/>
  </g>
  <text x="70" y="570" fill="#9c8d72" font-family="Consolas,monospace" font-size="15">REPAIR THE RESPONSIBLE UPSTREAM RULE · DO NOT POLISH A BROKEN CLAIM</text>
</svg>
